name: Prepare WASM Playground source migration
on:
  push:
    branches: [prepare/wasm-play-source031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: clippy,rustfmt
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve original formal graph and build actual interpreter
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.30.1
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
          mkdir -p acceptance
          cargo fmt --check
          wasm-pack build -t web -- --locked
          yarn test | tee acceptance/runtime-before.txt
      - name: Preserve original frontend gates
        run: |
          set -euo pipefail
          calcit --warn-dyn-method --check-only --all-defs --format json > acceptance/all-before.json
          calcit fix --workflow strict --verify --format json | tee acceptance/strict-before.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit analyze quality --baseline config/calcit-quality.cirru | tee acceptance/quality-before.txt
          yarn compile
          yarn build
      - name: Official guarded source migration
        run: node apply-reviewed.mjs
      - name: Resolve target published graph
        run: |
          set -euo pipefail
          cp target-deps.cirru deps.cirru
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          cmp deps.cirru target-deps.cirru
          git diff --quiet -- package.json yarn.lock .yarnrc.yml
      - name: Complete original gates on source and target graph
        run: |
          set -euo pipefail
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-after-blob.txt)"
          calcit --warn-dyn-method --check-only --all-defs --format json > acceptance/all.json
          calcit --check-only --ns 'app.$meta' --ns app.comp.container --ns app.config --ns app.main --ns app.schema --ns app.updater --format json > acceptance/public.json
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit analyze quality --baseline config/calcit-quality.cirru | tee acceptance/quality.txt
          calcit analyze weak-types --only deprecated-call --summary-only --format json | tee acceptance/deprecated.json | jq -e '.data.summary.calls == 0'
          calcit analyze weak-types --only dynamic-method --summary-only --format json | tee acceptance/dynamic-method.json | jq -e '.data.summary.findings == 0'
          yarn test | tee acceptance/runtime.txt
          yarn compile
          yarn build
          git diff --quiet -- config src script tests Cargo.toml Cargo.lock package.json yarn.lock .yarnrc.yml
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist js-out pkg acceptance/
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: wasm-play-source-evidence
          path: acceptance
          if-no-files-found: error
          retention-days: 30
