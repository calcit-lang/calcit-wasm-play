on:
  push:
    branches:
      - main

  pull_request: {}

name: Upload

permissions:
  contents: read

concurrency:
  group: upload-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: clippy,rustfmt

      - uses: taiki-e/install-action@v2.87.5
        with:
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: "enable Yarn"
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          yarn --version

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0

      - name: "install modules"
        run: caps --strict --ci

      - run: yarn install --immutable

      - name: "verify Calcit toolchain"
        run: caps verify --toolchain

      - name: "check Rust formatting"
        run: cargo fmt --check

      - run: wasm-pack build -t web

      - name: "compiles to js"
        run: |
          calcit calcit.cirru js
          yarn vite build --base=./

      - name: "validate snapshot and entry"
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze check-types --summary-only --format json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
          calcit calcit.cirru analyze deprecated --summary-only --format json
          calcit calcit.cirru analyze dynamic-methods --max 0
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

      - name: Deploy to server
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: steps.deploy.outcome != 'skipped'
        run: echo "${{ steps.deploy.outputs.status }}"
