name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: clippy,rustfmt

      - name: Install wasm-pack
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: wasm-pack@0.15.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Set up Calcit and Caps
        uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Resolve immutable dependencies
        run: |
          # Published dependencies request different compatible Respo and
          # js-ffi versions; Caps records the deterministic highest selections.
          caps --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Validate Rust and build WebAssembly
        run: |
          cargo fmt --check
          wasm-pack build -t web

      - name: Validate Calcit upgrade
        run: |
          test "$(calcit --version)" = "0.27.0"
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --strict-types --warn-dyn-method --check-only
          calcit calcit.cirru analyze check-public \
            --ns app.comp.container \
            --ns app.config \
            --ns app.main \
            --ns app.schema \
            --ns app.updater \
            --summary-only --format json
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

      - name: Select CDN asset path
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          fi
          base_url="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

      - name: Build web assets with CDN URLs
        run: |
          yarn compile
          yarn build

      - name: Check production revision
        id: production-revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test -n "$latest"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping outdated production revision ${GITHUB_SHA}"
          fi

      - name: Check COS credentials
        id: cos-credentials
        if: (github.event_name == 'push' && steps.production-revision.outputs.current == 'true') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
            else
              echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
              exit 1
            fi
          fi

      - name: Upload and verify static assets on COS
        if: steps.cos-credentials.outputs.available == 'true'
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy web assets to tiye.me
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.production-revision.outputs.current == 'true'
        id: deploy
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: -avzr --progress
          options: ""
          ssh_options: ""
          src: dist/*
          dest: rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}

      - name: Display deployment status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.production-revision.outputs.current == 'true'
        run: echo "${{ steps.deploy.outputs.status }}"
