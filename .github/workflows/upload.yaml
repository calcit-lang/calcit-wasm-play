on:
  push:
    branches:
      - main

  pull_request: {}

name: Upload

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: clippy

      - uses: jetli/wasm-pack-action@v0.3.0
        with:
          version: "latest"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: "enable Yarn"
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          yarn --version

      - uses: calcit-lang/setup-cr@0.0.9

      - name: "install modules"
        run: caps --ci

      - run: wasm-pack build -t web

      - run: yarn install --immutable

      - name: "compiles to js"
        run: |
          cr calcit.cirru js
          yarn vite build --base=./

      - name: "validate snapshot and entry"
        run: |
          cr calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          cr calcit.cirru --check-only
          cr calcit.cirru analyze check-types --summary-only --format json
          cr calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
          cr calcit.cirru analyze deprecated --summary-only --format json

      - name: Deploy to server
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: steps.deploy.outcome != 'skipped'
        run: echo "${{ steps.deploy.outputs.status }}"
