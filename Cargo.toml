[package]
name = "calcit-wasm-play"
version = "0.1.0"
edition = "2024"
description = "WASM playground for Calcit language"
repository = "https://github.com/calcit-lang/wasm-play"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
calcit = "0.13.65"
rpds = "1.2.0"
im_ternary_tree = "0.0.18"
wasm-bindgen = "0.2.108"
console_error_panic_hook = "*"
web-sys = { version = "0.3.85", features = ["console", 'Window'] }
js-sys = "0.3.85"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
debug = true
